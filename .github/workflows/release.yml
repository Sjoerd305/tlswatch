name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  ci:
    # The same checks as on every push to main; nothing is published
    # unless they pass on the tagged commit.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  binaries:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for p in linux/amd64 linux/arm64 darwin/arm64; do
            os=${p%/*}; arch=${p#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/tlswatch-${GITHUB_REF_NAME}-${os}-${arch} ./cmd/tlswatch
          done
          cd dist && sha256sum tlswatch-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v0.0.x tags are test releases: marked as such, and the image
          # below does not move "latest" for them.
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') }}
  image:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          # The image name is spelled out: ghcr.io wants it lower case, and
          # github.repository carries the account's capital letter.
          tags: |
            ghcr.io/sjoerd305/tlswatch:${{ github.ref_name }}
            ${{ !startsWith(github.ref_name, 'v0.0.') && 'ghcr.io/sjoerd305/tlswatch:latest' || '' }}

{{define "content"}}{{$d := .Data}}
<form class="login-card" method="post" action="/login/code" autocomplete="off">
  <h1 class="h3">Two-factor sign-in</h1>
  {{template "csrf" .CSRF}}
  {{- if $d.Error}}<div class="notice crit" role="alert">{{template "notice-icon" "crit"}}<div>{{$d.Error}}</div></div>{{end}}
  <div class="field"><label class="label" for="code">Code from your authenticator app</label><input id="code" name="code" class="input mono" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" maxlength="20" required autofocus>
    <span class="help">Lost your phone? Enter one of your recovery codes instead.</span></div>
  <button type="submit" class="btn btn-primary">Sign in</button>
  <a href="/login" class="btn">Cancel</a>
</form>
{{end}}
